
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow Dashboard</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #101018;
    color: #f5f5fa;
    min-height: 100vh;
}

.layout {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 230px;
    padding: 35px 25px;
    background: #171722;
    border-right: 1px solid #292938;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #a78bfa;
    margin-bottom: 55px;
}

.nav {
    color: #a1a1b5;
    line-height: 3.5;
}

.nav .active { color: white; }

main {
    flex: 1;
    padding: 45px;
    max-width: 1200px;
}

h1 { font-size: 32px; margin-bottom: 10px; }

.subtitle { color: #9999aa; margin-bottom: 35px; }

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 35px;
}

.card {
    background: #1b1b29;
    border: 1px solid #303044;
    border-radius: 15px;
    padding: 24px;
}

.card p { color: #9999aa; margin-bottom: 12px; }

.card h2 { font-size: 30px; color: #c4b5fd; }

.task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

button {
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
}

button:hover { background: #7c3aed; }

input {
    background: #222232;
    border: 1px solid #39394d;
    color: white;
    border-radius: 9px;
    padding: 13px;
    width: 100%;
    margin-bottom: 12px;
    outline: none;
}

input:focus { border-color: #8b5cf6; }

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px;
    background: #1b1b29;
    border: 1px solid #303044;
    border-radius: 12px;
    margin-bottom: 12px;
}

.task small { color: #9999aa; }

.priority { color: #c4b5fd; }

#message { color: #fca5a5; margin-bottom: 15px; }
#message.success { color: #86efac; }
.task-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.complete-btn {
    background: #29243d;
    border: 1px solid #8b5cf6;
    color: #c4b5fd;
    padding: 9px 14px;
}
.edit-btn,
.delete-btn {
    background: #29243d;
    border: 1px solid #8b5cf6;
    color: #c4b5fd;
    padding: 9px 14px;
}
.complete-btn:disabled {
    background: #272737;
    color: #a78bfa;
    opacity: 0.7;
    cursor: default;
}
@media(max-width: 700px) {
 
    .sidebar { display: none; }
    main { padding: 22px; }
    .stats { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="layout">

<aside class="sidebar">
    <div class="logo">✦ FocusFlow</div>
    <div class="nav">
        <div class="active">▦ Dashboard</div>
        <div>✓ My Tasks</div>
        <div>◷ Focus Sessions</div>
        <div>⚙ Settings</div>
    </div>
</aside>

<main>
    <h1>Good day! 👋</h1>
    <p class="subtitle">Let's make today productive.</p>

    <section class="stats">
        <div class="card">
            <p>Total Tasks</p>
            <h2 id="total">0</h2>
        </div>
        <div class="card">
            <p>Completed</p>
            <h2 id="completed">0</h2>
        </div>
        <div class="card">
            <p>Pending</p>
            <h2 id="pending">0</h2>
        </div>
    </section>

    <section>
        <div class="task-header">
            <h2>My Tasks</h2>
        </div>

        <input id="taskTitle" placeholder="What do you need to do?">
        <button onclick="addTask()">+ Add Task</button>

        <p id="message"></p>

        <div id="taskList" style="margin-top:25px">
            Loading tasks...
        </div>
    </section>
</main>

</div>

<script>
const USER_ID = 1;

// Ask the Flask routes for this user's tasks and refresh the dashboard.
async function loadTasks() {
    const response = await fetch(`/tasks?user_id=${USER_ID}`);
    const tasks = await response.json();

    document.getElementById("total").textContent = tasks.length;

    const completed = tasks.filter(t => t.status === "completed").length;
    document.getElementById("completed").textContent = completed;
    document.getElementById("pending").textContent = tasks.length - completed;

    const list = document.getElementById("taskList");

    if (!tasks.length) {
        list.innerHTML = "<p>No tasks yet. Add your first task!</p>";
        return;
    }

    list.innerHTML = tasks.map(task => `
        <div class="task">
            <div>
                <strong>${escapeHTML(task.title)}</strong>
                <br><small>${escapeHTML(task.description || "No description")}</small>
            </div>
           <div class="task-actions">
    <span class="priority">${escapeHTML(task.priority)}</span>

    <button
        class="edit-btn"
        onclick="editTask(${task.id}, '${escapeHTML(task.title).replace(/'/g, "\\'")}')"
    >
        Edit
    </button>
<button
    class="delete-btn"
    onclick="deleteTask(${task.id})"
>
    Delete
</button>
    <button
        class="complete-btn"
        onclick="completeTask(${task.id})"
        ${task.status === "completed" ? "disabled" : ""}
    >
        ${task.status === "completed" ? "Completed ✓" : "Complete"}
    </button>
</div>

        </div>
    `).join("");
}
async function editTask(taskId, currentTitle) {
    const newTitle = prompt("Edit your task:", currentTitle);

    if (newTitle === null || !newTitle.trim()) {
        return;
    }

    const response = await fetch(`/tasks/${taskId}`, {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: newTitle.trim()
        })
    });

    if (response.ok) {
        await loadTasks();
    } else {
        alert("Could not update task.");
    }
}
async function deleteTask(taskId) {
    const confirmed = confirm("Are you sure you want to delete this task?");

    if (!confirmed) {
        return;
    }

    const response = await fetch(`/tasks/${taskId}/delete`, {
        method: "DELETE"
    });

    if (response.ok) {
        await loadTasks();
    } else {
        alert("Could not delete task.");
    }
}
async function completeTask(taskId) {
    const response = await fetch(`/tasks/${taskId}/complete`, {
        method: "PATCH"
    });

    if (response.ok) {
        await loadTasks();
    } else {
        alert("Could not complete task.");
    }
}
// Escape text before putting it into the task list HTML.
function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

async function addTask() {
    const titleInput = document.getElementById("taskTitle");
    const message = document.getElementById("message");
    const title = titleInput.value.trim();

    if (!title) {
        message.className = "";
        message.textContent = "Please enter a task.";
        return;
    }

    const response = await fetch("/tasks", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            title: title,
            user_id: USER_ID,
            priority: "medium"
        })
    });

    const result = await response.json();

    if (!response.ok) {
        message.className = "";
        message.textContent = result.error || "Could not create task.";
        return;
    }

    titleInput.value = "";
    message.className = "success";
    message.textContent = "Task added successfully!";
    await loadTasks();
}

loadTasks();
</script>
</body>
</html>
